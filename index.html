<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador RPSP - Quiz Inteligente</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
<div class="container">
    <header>
        <h1 id="header-titulo">QUIZ BÍBLICO</h1>
        <p id="header-subtitulo"></p>
    </header>
    <div id="secao-publica" style="margin-top: 20px; border-top: 4px solid var(--primary); padding-top: 20px;">
        <div class="card">
            <h2>🎥 Material em Vídeo</h2>
            <a id="pub-link-v1" class="video-btn" target="_blank" href="#">📖 Assistir Leitura</a>
            <a id="pub-link-v2" class="video-btn" target="_blank" href="#">💡 Assistir Comentário</a>
        </div>
        <div class="card">
            <h2>📜 Resumo Ilustrado</h2>
            <div class="container-imagem-resumo" id="container-da-imagem">
                <img id="pub-img-resumo" class="imagem-resumo-img" src="" alt="Resumo Ilustrado">
            </div>
        </div>
        <div class="card">
            <h2>🎯 Quiz do Conhecimento</h2>
            <form id="quiz-form">
                <div id="container-questoes-publicas"></div>
                <button type="button" class="btn btn-primary" onclick="corrigirQuiz()">✅ FINALIZAR QUIZ</button>
            </form>
        </div>
        <div id="resultado-card" class="card" style="display:none; text-align:center;">
            <div class="badge">RESULTADO</div>
            <h2 style="justify-content: center;" id="resultado-status">🎉 Parabéns!</h2>
            <div id="resultado-score" class="score-big">0 / 0</div>
            <p id="resultado-percentual" style="font-weight: bold; margin-bottom: 8px;">0%</p>
            <p id="resultado-mensagem">Continue lendo a Palavra diariamente!</p>
            <button type="button" class="btn btn-warning" onclick="limparRespostasPublicas()" style="margin-top:15px;">🔄 REFAZER QUIZ</button>
        </div>
    </div>
</div>
<script>
    let dadosQuiz = JSON.parse("{\"capitulo\":\"📖 SALMOS 03\",\"tituloApoio\":\"🕊️ #RPSP\",\"urlV1\":\"https://youtu.be/EEmfUGc1aSo?is=7zMZK2VFMeKWEZd_\",\"urlV2\":\"https://youtu.be/aYSMmtrDqdM?is=jsryAXIkiJeU6XtF\",\"imagemResumo\":\"\",\"questoes\":[{\"num\":1,\"pergunta\":\"Qual era a principal causa da angústia de Davi apresentada no Salmo 03???\",\"a\":\" A falta de alimentos em Israel\",\"b\":\" Uma guerra contra os filisteus\",\"c\":\" A rebelião de seu próprio filho, Absalão\",\"d\":\" A perda de suas riquezas\",\"correta\":\"C\"},{\"num\":2,\"pergunta\":\"Quem se rebelou contra Davi para tentar tomar o trono de Israel???\",\"a\":\" Amnon\",\"b\":\" Absalão\",\"c\":\" Urias\",\"d\":\" Saul\",\"correta\":\"B\"},{\"num\":3,\"pergunta\":\"Embora Absalão fosse responsável por suas próprias escolhas, o que seu comportamento também refletia???\",\"a\":\" A prosperidade do reino\",\"b\":\" A força do exército de Israel\",\"c\":\" O ambiente de uma família desestruturada\",\"d\":\" A influência dos reis vizinhos\",\"correta\":\"C\"},{\"num\":4,\"pergunta\":\"Qual grave erro Davi cometeu para ficar com a esposa de Urias???\",\"a\":\" Expulsou Urias de Israel\",\"b\":\" Prendeu Urias injustamente\",\"c\":\" Tirou Urias do exército\",\"d\":\" Providenciou a morte de Urias\",\"correta\":\"D\"},{\"num\":5,\"pergunta\":\"Qual foi uma das consequências da violência ocorrida na família de Davi???\",\"a\":\" Absalão abandonou Israel\",\"b\":\" Absalão matou Amnon para vingar Tamar\",\"c\":\" Amnon tomou o trono de Israel\",\"d\":\" Tamar se tornou rainha\",\"correta\":\"B\"},{\"num\":6,\"pergunta\":\"Quem foi vítima da violência de Amnon???\",\"a\":\" Tamar\",\"b\":\" Bate-Seba\",\"c\":\" Mical\",\"d\":\" Abigail\",\"correta\":\"A\"},{\"num\":7,\"pergunta\":\"Mesmo sendo perdoado por Deus, o que as atitudes erradas de Davi deixaram na vida dos filhos???\",\"a\":\" Apenas riquezas\",\"b\":\" Apenas boas lembranças\",\"c\":\" Consequências e influências profundas\",\"d\":\" Nenhuma consequência\",\"correta\":\"C\"},{\"num\":8,\"pergunta\":\"O que a frase de Gandhi \\\"Não posso exigir dos outros aquilo que eu mesmo não pratico\\\" ensina???\",\"a\":\" Que devemos sempre exigir mais dos outros\",\"b\":\" Que os pais não precisam dar exemplos\",\"c\":\" Que somente os líderes precisam praticar aquilo que ensinam\",\"d\":\" Que não devemos exigir dos outros aquilo que nós mesmos não praticamos\",\"correta\":\"D\"},{\"num\":9,\"pergunta\":\"Por que Gandhi esperou um mês antes de aconselhar o menino a parar de comer doces???\",\"a\":\" Porque estava viajando\",\"b\":\" Porque não conhecia o menino\",\"c\":\" Porque precisava primeiro passar um mês sem comer doces\",\"d\":\" Porque queria testar a mãe do menino\",\"correta\":\"C\"},{\"num\":10,\"pergunta\":\"Qual é uma das principais lições da reflexão sobre a família???\",\"a\":\" Os pais são exemplos positivos ou negativos para os seus filhos\",\"b\":\" Os erros dos pais nunca influenciam os filhos\",\"c\":\" Os filhos são sempre responsáveis pelos erros dos pais\",\"d\":\" O exemplo dos pais não tem importância na formação dos filhos\",\"correta\":\"A\"}]}");
    const marcadoresQuestoes = ["🤔 01", "🤔 02", "🤔 03", "🤔 04", "🤔 05", "🤔 06", "🤔 07", "🤔 08", "🤔 09", "🤔 10"];
    window.onload = function() {
        document.getElementById("header-titulo").innerText = dadosQuiz.capitulo ? dadosQuiz.capitulo.toUpperCase() : "QUIZ BÍBLICO";
        document.getElementById("header-subtitulo").innerText = dadosQuiz.tituloApoio || "";
        document.getElementById("pub-link-v1").href = dadosQuiz.urlV1 || "#";
        document.getElementById("pub-link-v2").href = dadosQuiz.urlV2 || "#";
        if(dadosQuiz.imagemResumo){
             document.getElementById("pub-img-resumo").src = dadosQuiz.imagemResumo;
        } else {
             document.getElementById("container-da-imagem").style.display = "none";
        }
        const container = document.getElementById("container-questoes-publicas");
        container.innerHTML = "";
        dadosQuiz.questoes.forEach(function(q) {
            if(!q.pergunta) return;
            const div = document.createElement("div");
            div.className = "q-card";
            div.innerHTML = '<div class="q-titulo">' + marcadoresQuestoes[q.num-1] + '. ' + q.pergunta + '</div>' +
                '<div class="opcoes-container">' +
                    '<label class="opcao-label" id="label-q' + q.num + '-A"><input type="radio" name="publica' + q.num + '" value="A"> A) ' + q.a + '</label>' +
                    '<label class="opcao-label" id="label-q' + q.num + '-B"><input type="radio" name="publica' + q.num + '" value="B"> B) ' + q.b + '</label>' +
                    '<label class="opcao-label" id="label-q' + q.num + '-C"><input type="radio" name="publica' + q.num + '" value="C"> C) ' + q.c + '</label>' +
                    '<label class="opcao-label" id="label-q' + q.num + '-D"><input type="radio" name="publica' + q.num + '" value="D"> D) ' + q.d + '</label>' +
                '</div>';
            container.appendChild(div);
        });
    };
    function corrigirQuiz() {
    let acertos = 0;
    let totalValidas = 0;
    dadosQuiz.questoes.forEach(q => {
        if(!q.pergunta) return;
        totalValidas++;
        const marcado = document.querySelector(`input[name="publica${q.num}"]:checked`);
        ['A','B','C','D'].forEach(l => {
            const el = document.getElementById(`label-q${q.num}-${l}`);
            if(el) el.classList.remove('correta-marcada','errada-marcada');
        });
        if(marcado) {
            if(marcado.value === q.correta) { 
                acertos++; 
                document.getElementById(`label-q${q.num}-${q.correta}`).classList.add('correta-marcada'); 
            } else { 
                document.getElementById(`label-q${q.num}-${marcado.value}`).classList.add('errada-marcada'); 
                document.getElementById(`label-q${q.num}-${q.correta}`).classList.add('correta-marcada'); 
            }
        } else { 
            const elCorreta = document.getElementById(`label-q${q.num}-${q.correta}`);
            if(elCorreta) elCorreta.classList.add('correta-marcada'); 
        }
    });
    
    let pct = totalValidas > 0 ? Math.round((acertos/totalValidas)*100) : 0;
    let statusTexto = "";
    let mensagemTexto = "";
    if (pct === 100) {
        statusTexto = "🏆 Excelente!!!";
        mensagemTexto = "Você domina completamente o assunto deste capítulo.";
    } else if (pct >= 70) {
        statusTexto = "🤩 Muito Bem!!!";
        mensagemTexto = "Ótimo Resultado!!! Seu Conhecimento Bíblico está Afiado.";
    } else if (pct >= 50) {
        statusTexto = "👍 Bom Trabalho!!!";
        mensagemTexto = "Você acertou metade ou mais! Continue firme na leitura.";
    } else {
        statusTexto = "📚 Vamos Revisar???";
        mensagemTexto = "Vale a Pena Ler o Capítulo Novamente para Fixar o Conhecimento.";
    }
    
    document.getElementById('resultado-status').innerText = statusTexto;
    document.getElementById('resultado-mensagem').innerText = mensagemTexto;
    document.getElementById('resultado-card').style.display = "block";
    document.getElementById('resultado-score').innerText = `${acertos} de ${totalValidas}`;
    document.getElementById('resultado-percentual').innerText = `Aproveitamento: ${pct}%`;
    document.getElementById('resultado-card').scrollIntoView({behavior:'smooth'});
}
    function limparRespostasPublicas() {
    const inputs = document.querySelectorAll('#quiz-form input[type="radio"]');
    inputs.forEach(input => input.checked = false);
    
    const labels = document.querySelectorAll('.opcao-label');
    labels.forEach(label => label.classList.remove('correta-marcada', 'errada-marcada'));

    document.getElementById('resultado-card').style.display = "none";
    window.scrollTo({top: document.getElementById('secao-publica').offsetTop, behavior: 'smooth'});
}
</script>
</body>
</html>
